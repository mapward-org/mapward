# Проверка pull request'а: без прав на запись и без секретов — она запускает чужой код.
# Скрипт проверки берётся из main, индексы — из pull request'а. Решение принимает merge.yml.
name: check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @mapward/cli@latest
      - run: node base/scripts/check.mjs --base base --pr pr --out out
      - if: always()
        run: |
          echo "${{ github.event.pull_request.number }}" > out/pr.txt
          echo "${{ github.event.pull_request.head.sha }}" > out/sha.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check
          path: out
